name: Release Client

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要发布的 tag，例如 v2.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality-check:
    name: Offline quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run verify:offline

  build:
    name: Build ${{ matrix.os }}
    needs: quality-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        working-directory: client
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Cache Electron build downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Smoke test Electron native dependencies
        run: npm run smoke:electron-native

      - name: Sync package version from tag
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#[vV]}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: |
          rm -rf assets/icon.iconset
          mkdir -p assets/icon.iconset
          sips -z 16 16 assets/icon_256.png --out assets/icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon_256.png --out assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon_256.png --out assets/icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon_256.png --out assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon_256.png --out assets/icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon_256.png --out assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon_256.png --out assets/icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon_256.png --out assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon_256.png --out assets/icon.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon_256.png --out assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns assets/icon.iconset -o assets/icon.icns

      - name: Build renderer
        run: npm run build

      - name: Preload Electron macOS runtimes
        if: runner.os == 'macOS'
        run: |
          export ELECTRON_CACHE="$HOME/Library/Caches/electron"
          ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
          cache_dir="$ELECTRON_CACHE"
          mkdir -p "$cache_dir"

          for arch in x64 arm64; do
            file="$cache_dir/electron-v${ELECTRON_VERSION}-darwin-${arch}.zip"
            if [ -f "$file" ] && unzip -tq "$file" >/dev/null 2>&1; then
              echo "Electron ${ELECTRON_VERSION} darwin-${arch} already cached."
              continue
            fi

            tmp="${file}.tmp"
            rm -f "$file" "$tmp"
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 10 \
              "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-${arch}.zip" \
              --output "$tmp"
            unzip -tq "$tmp" >/dev/null
            mv "$tmp" "$file"
          done

      - name: Build Windows NSIS and ZIP artifacts
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis zip --publish never

      - name: Verify Windows installer
        if: runner.os == 'Windows'
        run: |
          shopt -s nullglob
          installers=(release/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "Missing Windows installer .exe."
            exit 1
          fi

      - name: Build and publish macOS artifacts
        if: runner.os == 'macOS'
        run: |
          export ELECTRON_CACHE="$HOME/Library/Caches/electron"
          export ELECTRON_BUILDER_CACHE="$HOME/Library/Caches/electron-builder"

          for attempt in 1 2 3; do
            echo "Build macOS artifacts, attempt ${attempt}/3."
            if npx electron-builder --mac --publish never; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 20))
          done

      - name: Package macOS DMG with instructions
        if: runner.os == 'macOS'
        run: |
          PRODUCT_NAME="$(node -p "require('./package.json').build.productName")"
          shopt -s nullglob
          for dmg in release/*.dmg; do
            base="$(basename "$dmg" .dmg)"
            package_dir="release/${base}-manual-package"
            rm -rf "$package_dir"
            mkdir -p "$package_dir"
            cp "$dmg" "$package_dir/"
            cat > "$package_dir/macOS使用说明.txt" <<EOF
          macOS 使用说明

          如果双击 App 提示“已损坏，无法打开”或“无法验证开发者”，这是因为本软件未进行 Apple 官方签名和公证，并不代表文件真的损坏。

          使用步骤：

          1. 双击 dmg 文件。
          2. 将“${PRODUCT_NAME}.app”拖到“应用程序”文件夹。
          3. 打开“终端”App。
          4. 执行下面命令：

          xattr -dr com.apple.quarantine "/Applications/${PRODUCT_NAME}.app"

          5. 再从“应用程序”中打开“${PRODUCT_NAME}”。

          如果仍无法打开，请右键点击 App，选择“打开”，再确认打开。
          EOF
            (cd release && ditto -c -k --sequesterRsrc --keepParent "$(basename "$package_dir")" "${base}-manual-package.zip")
            rm -rf "$package_dir"
          done

      - name: Prepare release assets
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.msi release/*.dmg release/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          sha_file="release/YuDuBid-${TAG_NAME#[vV]}-${RUNNER_OS}-sha256.txt"
          for file in "${files[@]}"; do
            node -e 'const fs=require("fs"),crypto=require("crypto"),path=require("path"),p=process.argv[1],hash=crypto.createHash("sha256"); fs.createReadStream(p).on("data",chunk=>hash.update(chunk)).on("error",error=>{console.error(error);process.exitCode=1}).on("end",()=>console.log(hash.digest("hex")+"  "+path.basename(p)))' "$file"
          done > "$sha_file"

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            client/release/*.exe
            client/release/*.msi
            client/release/*.dmg
            client/release/*.zip
            client/release/*-sha256.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release notes from commits
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          CURATED_NOTES=".github/release-notes/${TAG_NAME}.md"
          if [ -f "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" release_notes.md
            exit 0
          fi
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG_NAME}"
          else
            RANGE="$TAG_NAME"
            COMPARE_URL="https://github.com/${{ github.repository }}/commits/${TAG_NAME}"
          fi
          {
            echo "## 更新内容"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' || true
            echo
            echo
            echo "## What's Changed"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h)' || true
            echo
            echo
            echo "**Full Changelog**: $COMPARE_URL"
          } > release_notes.md
      - name: Verify staged assets and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.dmg' -print -quit)"
          test "$(find release-assets -maxdepth 1 -name '*-sha256.txt' | wc -l)" -eq 2
          (cd release-assets && sha256sum -c *-sha256.txt)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "Release 已公开发布，拒绝覆盖附件。"
              exit 1
            fi
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes-file release_notes.md
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber
          gh release edit "$TAG_NAME" --draft=false
